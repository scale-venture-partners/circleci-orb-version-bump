version: 2.1

orbs:
  version-bump: scale-venture-partners/version-bump@dev:dogfood

jobs:
  lint-and-test:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Install shellcheck, bats, node, and the circleci CLI
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck bats
            curl -fsSL https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/main/install.sh | sudo bash
            # node-package-json bats coverage needs a real `node` — cimg/base
            # doesn't include one.
            curl -fsSL https://nodejs.org/dist/v20.11.1/node-v20.11.1-linux-x64.tar.xz -o /tmp/node.tar.xz
            sudo tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
      - run:
          name: shellcheck
          command: shellcheck -s sh src/scripts/*.sh
      - run:
          name: bats
          command: bats test/
      - run:
          name: Pack the orb
          # Not `orb validate`: it calls the CircleCI API and needs an
          # authenticated token this job doesn't have. `./scripts/verify.sh`
          # covers validation locally (authenticated) before any real publish.
          command: circleci orb pack src > orb.yml
      - persist_to_workspace:
          root: .
          paths:
            - orb.yml

  pilot-check:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - version-bump/check:
          manifest-type: generic
          manifest-path: pilot/VERSION.txt
          version-pattern: 'version = "([0-9.]+)"'
          changelog-path: pilot/CHANGELOG.md

  publish-dev:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install the circleci CLI
          command: curl -fsSL https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/main/install.sh | sudo bash
      - run:
          name: Publish a dev build
          command: |
            circleci orb publish orb.yml scale-venture-partners/version-bump@dev:"${CIRCLE_BRANCH}" --token "${CIRCLECI_ORB_PUBLISH_TOKEN}"

  publish-release:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install the circleci CLI
          command: curl -fsSL https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/main/install.sh | sudo bash
      - run:
          name: Publish the tagged release
          command: |
            circleci orb publish orb.yml scale-venture-partners/version-bump@"${CIRCLE_TAG#v}" --token "${CIRCLECI_ORB_PUBLISH_TOKEN}"

workflows:
  build:
    jobs:
      - lint-and-test:
          filters:
            tags:
              only: &release-tag /^v[0-9]+\.[0-9]+\.[0-9]+$/
      - pilot-check
      # Requires the `orb-publishing` context (CIRCLECI_ORB_PUBLISH_TOKEN) — see README.md.
      - publish-dev:
          requires:
            - lint-and-test
          context: orb-publishing
          filters:
            tags:
              ignore: /.*/
      - publish-release:
          requires:
            - lint-and-test
          context: orb-publishing
          filters:
            branches:
              ignore: /.*/
            tags:
              only: *release-tag
